spring.application.name=StocklyBackend

# MariaDB Connection
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/stockly_db}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Generate a 32-byte (or longer) random secret and provide it as JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=stockly-api
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}